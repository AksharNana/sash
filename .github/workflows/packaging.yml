name: Packaging
on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['packaging/**', 'pyproject.toml', 'uv.lock', '.github/workflows/packaging.yml']
  workflow_dispatch:

jobs:
  dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -n 1)
          [ "${GITHUB_REF_NAME#v}" = "$version" ] || { echo "tag $GITHUB_REF_NAME != pyproject version $version"; exit 1; }

      - uses: astral-sh/setup-uv@v6

      - name: Vendor dependencies and create the orig tarball
        run: |
          packaging/scripts/vendor.sh
          packaging/scripts/make-source.sh dist/ppa

      - uses: actions/upload-artifact@v7
        with:
          name: sash-orig.tar.gz
          path: dist/ppa/sash_*.orig.tar.gz

  ppa-source-check:
    needs: dist
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        series: [jammy, noble]

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper dh-virtualenv dpkg-dev lintian

      - name: Download the orig tarball
        uses: actions/download-artifact@v8
        with:
          name: sash-orig.tar.gz
          path: dist/ppa

      - name: Build the Debian source package
        run: packaging/scripts/make-source.sh dist/ppa ${{ matrix.series }}

      - name: Lint the source package
        run: |
          lintian dist/ppa/sash_*~${{ matrix.series }}1_source.changes

      - name: Upload Debian source package
        uses: actions/upload-artifact@v7
        with:
          name: sash-ppa-source-${{ matrix.series }}
          path: |
            dist/ppa/sash_*.dsc
            dist/ppa/sash_*.orig.tar.gz
            dist/ppa/sash_*.debian.tar.xz
            dist/ppa/sash_*_source.changes
            dist/ppa/sash_*_source.buildinfo

  deb:
    strategy:
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-latest, image: "ubuntu:22.04"}
          - {arch: amd64, runner: ubuntu-latest, image: "ubuntu:24.04"}
          - {arch: amd64, runner: ubuntu-latest, image: "debian:bookworm"}
          - {arch: amd64, runner: ubuntu-latest, image: "debian:trixie"}
          - {arch: arm64, runner: ubuntu-24.04-arm, image: "ubuntu:22.04"}
          - {arch: arm64, runner: ubuntu-24.04-arm, image: "ubuntu:24.04"}
          - {arch: arm64, runner: ubuntu-24.04-arm, image: "debian:bookworm"}
          - {arch: arm64, runner: ubuntu-24.04-arm, image: "debian:trixie"}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Vendor dependencies
        run: packaging/scripts/vendor.sh

      - name: Build the .deb (on the release it targets)
        run: packaging/scripts/build-deb.sh ${{ matrix.image }}

      - name: Smoke test the .deb
        run: |
          docker run --rm -v "$PWD/dist":/dist ${{ matrix.image }} sh -ec '
              apt-get update
              apt-get install -y /dist/sash_*.deb
              sash --help
          '

      - uses: actions/upload-artifact@v7
        with:
          name: sash-deb-${{ matrix.arch }}-${{ strategy.job-index }}
          path: dist/*.deb

  release:
    runs-on: ubuntu-latest
    needs: deb
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: sash-deb-*
          merge-multiple: true

      - name: Attach the .deb files to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" ./*.deb --clobber

  publish-ppa:
    runs-on: ubuntu-latest
    needs: ppa-source-check
    if: startsWith(github.ref, 'refs/tags/v')
    environment: ppa-release

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y devscripts dput gnupg openssh-client python3-paramiko

      - name: Download the Debian source packages
        uses: actions/download-artifact@v8
        with:
          pattern: sash-ppa-source-*
          merge-multiple: true

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.PPA_GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')" >> "$GITHUB_ENV"

      - name: Configure SFTP upload to Launchpad
        env:
          SSH_KEY: ${{ secrets.PPA_SSH_KEY }}
          PPA_TARGET: ${{ vars.PPA_TARGET }}
          PPA_LOGIN: ${{ vars.PPA_LOGIN }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan ppa.launchpad.net >> ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/known_hosts

          # the owner is PPA_LOGIN; PPA_TARGET (ppa:owner/name) supplies the name
          ppa=${PPA_TARGET#ppa:}
          name=${ppa#*/}
          cat > ~/.dput.cf <<EOF
          [ppa-sftp]
          fqdn = ppa.launchpad.net
          method = sftp
          incoming = ~${PPA_LOGIN}/ubuntu/${name}/
          login = ${PPA_LOGIN}
          allow_unsigned_uploads = 0
          EOF

      - name: Sign and upload to the PPA
        env:
          GPG_PASSPHRASE: ${{ secrets.PPA_GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PASSPHRASE" > /tmp/gpg-passphrase
          failed=""
          for changes in sash_*_source.changes
          do
              debsign -k"$KEYID" -p"gpg --batch --yes --pinentry-mode loopback --passphrase-file /tmp/gpg-passphrase" "$changes"
              uploaded=""
              for attempt in 1 2 3 4 5
              do
                  if dput ppa-sftp "$changes"
                  then
                      uploaded=yes
                      break
                  fi
                  echo "upload of $changes failed (attempt $attempt); retrying in 60s"
                  sleep 60
              done
              [ -n "$uploaded" ] || failed="$failed $changes"
              # give Launchpad's upload server time to finish the previous upload
              sleep 30
          done
          rm -f /tmp/gpg-passphrase
          [ -z "$failed" ] || { echo "failed uploads:$failed"; exit 1; }
