description: Glob test mismatch

sources:
  - https://stackoverflow.com/questions/48854121/check-if-files-of-a-given-type-exist-in-bash-shell

bugs:
  bug00:
    description: The glob in the test is quoted, so it is never expanded; the test only checks for a file literally named '*.zip', so it practically always fails and the files are never moved
    code: const_cond
    shellcheck: null
    notes:
      - ShellCheck (0.11.0) reports nothing on this script
      - This bug used to be SaSh's cmd_expected_path_state warning about mv's destination 'zip/', which is a false positive (it relied on assuming 'zip/' is a file); see issue #42 (quoted_glob_no_match)

ground_truths:
  - path: original.sh
    kind: original
    bugs:
      bug00: { lines: [3] }

  - path: posix.sh
    kind: buggy
    bugs:
      bug00: { lines: [3] }

  - path: fixed.sh
    kind: fixed
    bugs:
      bug00: { regression_lines: [3], shellcheck: null }
